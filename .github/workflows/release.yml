name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    environment:
      name: Chrome Web Store
      url: https://chromewebstore.google.com/detail/${{ vars.EXTENSION_ID }}
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION_ID: ${{ vars.EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        # Fail before semantic-release runs: the store upload is its last step, so
        # without a publisher ID the run would fail only after the GitHub release
        # and the chore(release) commit exist.
        run: |
          if [ -z "$PUBLISHER_ID" ]; then
            echo "::error::PUBLISHER_ID is empty. Set the Chrome Web Store environment's PUBLISHER_ID variable to the publisher ID from the Chrome Web Store Developer Dashboard's Settings page."
            exit 1
          fi
          npx semantic-release
